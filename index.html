<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Документирование</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <h1>Документирование</h1>
        <p>Единое место, где команда хранит документы и ведет документацию как код.</p>
      </header>

      <section class="card">
        <h2>Разделы</h2>
        <div id="sections" class="grid"></div>
      </section>

      <section class="card">
        <h2>Базовый процесс</h2>
        <ol>
          <li>Обновляйте документы в отдельных ветках.</li>
          <li>Открывайте Pull Request с пояснением «что изменено и зачем».</li>
          <li>После ревью объединяйте изменения в основную ветку.</li>
        </ol>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
